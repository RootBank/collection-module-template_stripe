name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: collection_module/package-lock.json

      - name: Install dependencies
        run: |
          cd collection_module
          npm ci

      - name: Create env.ts for build
        run: |
          cd collection_module
          cp code/env.sample.ts code/env.ts

      - name: Run ESLint
        run: |
          cd collection_module
          npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: collection_module/package-lock.json

      - name: Install dependencies
        run: |
          cd collection_module
          npm ci

      - name: Create env.ts for build
        run: |
          cd collection_module
          cp code/env.sample.ts code/env.ts

      - name: Run tests with coverage
        run: |
          cd collection_module
          npm test -- --coverage --ci

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            const coveragePath = './collection_module/coverage/coverage-summary.json';

            if (fs.existsSync(coveragePath)) {
              const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
              const total = coverage.total;

              const comment = `## 📊 Test Coverage Report

              | Category | Coverage |
              |----------|----------|
              | **Statements** | ${total.statements.pct.toFixed(2)}% |
              | **Branches** | ${total.branches.pct.toFixed(2)}% |
              | **Functions** | ${total.functions.pct.toFixed(2)}% |
              | **Lines** | ${total.lines.pct.toFixed(2)}% |

              ${total.statements.pct >= 70 ? '✅' : '❌'} Coverage threshold: 70%
              `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: collection_module/package-lock.json

      - name: Install dependencies
        run: |
          cd collection_module
          npm ci

      - name: Create env.ts for build
        run: |
          cd collection_module
          cp code/env.sample.ts code/env.ts

      - name: Build TypeScript
        run: |
          cd collection_module
          npm run build
          echo "✅ TypeScript compilation successful"
